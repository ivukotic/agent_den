limit_req_zone $binary_remote_addr zone=agent_den_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Inbound bandwidth is the tight constraint (see README) — no large bodies.
    client_max_body_size 32k;

    # NOTE: this is HTTP only. Put TLS termination (certbot/acme, or a
    # managed LB) in front of this before going live — see README > Roadmap.

    location = /robots.txt {
        default_type text/plain;
        alias /usr/share/nginx/html/robots.txt;
    }

    location = /llms.txt {
        default_type text/plain;
        alias /usr/share/nginx/html/llms.txt;
    }

    location /healthz {
        proxy_pass http://app:3000;
    }

    location / {
        limit_req zone=agent_den_limit burst=10 nodelay;

        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
